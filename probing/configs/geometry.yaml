# Hydra config for `python -m probing.geometry`.

defaults:
  - _self_
  - model: dinov3-base
  - data: full
  - override hydra/job_logging: default
  - override hydra/hydra_logging: default

feature_type: cls
output_dir: ${oc.env:GEOM_DIR,outputs/geometry}

# Bin edges (hPa) used to partition pressure for §4.2 analyses.
bins:
  edges: [875, 920, 960, 980, 990, 1000, 1020]

# Cap pairwise computations so that the feature-spread diagnostic
# stays cheap on large bins.
max_pairs: 200000

hydra:
  run:
    dir: ${output_dir}/.hydra/${model.name}/${feature_type}
